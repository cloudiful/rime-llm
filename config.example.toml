# The service only listens on loopback by default.
bind_addr = "127.0.0.1:32123"

# Model weights are downloaded here on first startup.
model_dir = "./models"
model_repo = "unsloth/Qwen3-0.6B-GGUF"
model_file = "Qwen3-0.6B-IQ4_XS.gguf"
tokenizer_repo = "Qwen/Qwen3-0.6B"

# Use "cpu" to disable Metal explicitly.
device = "metal"
context_window = 4096
max_candidates = 16
max_wait_ms = 15000
max_context_chars = 256
download_timeout_secs = 3600
dictionary_root = ".."
