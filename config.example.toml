# The service only listens on loopback by default.
bind_addr = "127.0.0.1:32123"

# Model weights are fetched via hf-hub and cached under the Hugging Face
# global cache (~/.cache/huggingface) by default. Set HF_ENDPOINT to use a
# mirror. Uncomment model_dir to override the cache location.
# model_dir = "./models"
model_repo = "unsloth/Qwen3-0.6B-GGUF"
model_file = "Qwen3-0.6B-Q4_K_M.gguf"
# The tokenizer and chat template are read from the GGUF model itself.

# Use "cpu" to disable Metal explicitly.
device = "metal"
context_window = 4096
max_candidates = 16
max_wait_ms = 15000
max_context_chars = 256
prediction_mode = "free"
prediction_max_candidates = 5
prediction_max_tokens = 8
prediction_timeout_ms = 15000
download_timeout_secs = 3600

# Bundled rime-ice dictionary. Point this at another Rime dictionary root to customize it.
dictionary_root = "./data/rime-ice"
