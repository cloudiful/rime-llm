# Experimental local model schema. The regular rime_ice schema is unchanged.
# encoding: utf-8

__include: rime_ice.schema.yaml:/

schema:
  schema_id: rime_ice_llm
  name: 雾凇拼音（本地模型）
  version: "2026-07-31"
  description: |
    雾凇拼音的本地模型实验方案
    模型服务不可用时由普通 Rime 拼音翻译器兜底。

engine:
  processors:
    - llm_predictor
    - lua_processor@*select_character
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  translators:
    - llm_predict_translator
    - punct_translator
    - script_translator
    - lua_translator@*date_translator
    - lua_translator@*lunar
    - lua_translator@*uuid
    - table_translator@custom_phrase
    - table_translator@melt_eng
    - table_translator@cn_en
    - table_translator@radical_lookup
    - lua_translator@*unicode
    - lua_translator@*number_translator
    - lua_translator@*calc_translator
    - lua_translator@*force_gc
  filters:
    - llm_candidate_filter
    - lua_filter@*corrector
    - reverse_lookup_filter@radical_reverse_lookup
    - lua_filter@*autocap_filter
    - lua_filter@*v_filter
    - lua_filter@*reduce_english_filter
    - simplifier@emoji
    - simplifier@traditionalize
    - lua_filter@*search@radical_pinyin
    - uniquifier

translator:
  dictionary: rime_ice
  user_dict: rime_ice_llm
  contextual_suggestions: false
  enable_user_dict: true
  enable_word_completion: true
  initial_quality: 1.2

llm_candidate_translator:
  enabled: true
  endpoint: http://127.0.0.1:32123/candidates
  max_candidates: 16
  replace_candidates: true
  max_wait_ms: 1500
  max_paths: 128
  max_homophones: 8
  quality_base: 1000
  debug: false

# Native macOS Squirrel plugin. The Lua block above remains available only as
# an explicit fallback; it is no longer mounted in the default engine list.
prediction:
  enabled: true
  endpoint: http://127.0.0.1:32123
  mode: free
  trigger: ""
  idle_delay_ms: 200
  max_candidates: 5
  max_tokens: 8
  timeout_ms: 15000
