[package]
name = "ime-daemon"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"
description = "Local input method daemon: sessions, candidate lattice, and async model reranking"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
ime-core = { path = "../ime-core" }
model-protocol = { path = "../model-protocol" }
pinyin-dict = { path = "../pinyin-dict" }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
